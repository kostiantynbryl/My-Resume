name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'cv/generate.py'
      - 'cv/generate_roles.py'
      - '.github/workflows/cv-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet reportlab
          python cv/generate.py
          python cv/generate_roles.py
      - name: Validate role variants
        run: |
          for role in RECRUITER ENGINEERING PRODUCT; do
            for lang in EN PL RU UA; do
              test -f "assets/cv/Kostiantyn_Bryl_CV_${role}_${lang}.pdf"
            done
          done
      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cv/*.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'build: refresh multilingual and role-specific CV PDFs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
