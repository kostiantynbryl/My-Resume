name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Required files
        run: |
          test -f index.html
          test -f multipage.css
          test -f multipage-v5.css
          test -f multipage.js
          test -f multipage-core.js
          test -f final-v1.js
          test -f portfolio-data.js
          test -f work/index.html
          test -f experience/index.html
          test -f case-studies/index.html
          test -f about/index.html
          test -f now/index.html
          test -f contact/index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f README.md
          test -f cv/generate.py

      - name: JavaScript syntax
        run: |
          node --check multipage.js
          node --check multipage-core.js
          node --check final-v1.js
          node --check portfolio-data.js

      - name: Generate recruiter PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet reportlab
          python cv/generate.py
          test -f assets/cv/Kostiantyn_Bryl_CV_EN.pdf
          test -f assets/cv/Kostiantyn_Bryl_CV_PL.pdf
          test -f assets/cv/Kostiantyn_Bryl_CV_RU.pdf
          test -f assets/cv/Kostiantyn_Bryl_CV_UA.pdf

      - name: Internal reference checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pages=list(root.glob('*.html'))+list(root.glob('*/*.html'))+list(root.glob('work/*/*.html'))
          missing=[]
          for page in pages:
              text=page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)="([^"#?]+)',text):
                  if ref.startswith(('http://','https://','mailto:','data:')): continue
                  target=(page.parent/ref).resolve()
                  if ref.endswith('/'):
                      target=target/'index.html'
                  if not target.exists(): missing.append(f'{page}: {ref}')
          if missing: raise SystemExit('Missing local references:\n'+'\n'.join(missing))
          print('Internal references OK')
          PY

      - name: Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          npm install --global @lhci/cli@0.15.x
          lhci autorun --config=lighthouserc.cjs

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci-reports
          if-no-files-found: error
          include-hidden-files: true

      - name: Enforce Lighthouse threshold
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
