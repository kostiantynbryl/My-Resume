name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Required files
        run: |
          test -f index.html
          test -f multipage.css
          test -f multipage.js
          test -f multipage-v4.js
          test -f work/index.html
          test -f experience/index.html
          test -f case-studies/index.html
          test -f about/index.html
          test -f contact/index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/norvexa.svg
      - name: JavaScript syntax
        run: |
          node --check multipage.js
          node --check multipage-v4.js
      - name: Internal reference checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          root=Path('.')
          pages=[root/'index.html',root/'work/index.html',root/'experience/index.html',root/'case-studies/index.html',root/'about/index.html',root/'contact/index.html']
          missing=[]
          for page in pages:
              text=page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)="([^"#?]+)',text):
                  if ref.startswith(('http://','https://','mailto:','data:')): continue
                  target=(page.parent/ref).resolve()
                  if ref.endswith('/'):
                      target=target/'index.html'
                  if not target.exists(): missing.append(f'{page}: {ref}')
          if missing: raise SystemExit('Missing local references:\n'+'\n'.join(missing))
          print('Multipage references OK')
          PY
