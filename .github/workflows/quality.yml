name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Required files
        run: |
          test -f index.html
          test -f multipage.css
          test -f multipage-v5.css
          test -f pro-v11.css
          test -f proof-v12.css
          test -f multipage.js
          test -f multipage-core.js
          test -f final-v1.js
          test -f a11y-v1.js
          test -f easter-v1.js
          test -f pre-v11.js
          test -f pro-v11-data.js
          test -f pro-v11.js
          test -f proof-v12-data.js
          test -f proof-v12.js
          test -f proof-v12-home.js
          test -f analytics-v12.js
          test -f portfolio-data.js
          test -f site.config.json
          test -f data/github.json
          test -f work/index.html
          test -f experience/index.html
          test -f case-studies/index.html
          test -f about/index.html
          test -f now/index.html
          test -f contact/index.html
          test -f ecosystem/index.html
          test -f system/index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml
          test -f README.md
          test -f DESIGN_FREEZE.md
          test -f brand/linkedin-profile.md
          test -f cv/generate.py
          test -f cv/generate_roles.py
          test -f scripts/site_snapshot.py
          test -f scripts/mobile_smoke.mjs

      - name: JavaScript, Python and config syntax
        run: |
          node --check multipage.js
          node --check multipage-core.js
          node --check final-v1.js
          node --check a11y-v1.js
          node --check easter-v1.js
          node --check pre-v11.js
          node --check pro-v11-data.js
          node --check pro-v11.js
          node --check proof-v12-data.js
          node --check proof-v12.js
          node --check proof-v12-home.js
          node --check analytics-v12.js
          node --check portfolio-data.js
          node --check scripts/mobile_smoke.mjs
          python -m py_compile cv/generate.py cv/generate_roles.py scripts/site_snapshot.py
          python - <<'PY'
          import json
          json.load(open('site.config.json',encoding='utf-8'))
          print('site.config.json OK')
          PY

      - name: Generate all recruiter PDFs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --quiet reportlab
          python cv/generate.py
          python cv/generate_roles.py
          for lang in EN PL RU UA; do test -f "assets/cv/Kostiantyn_Bryl_CV_${lang}.pdf"; done
          for role in RECRUITER ENGINEERING PRODUCT; do
            for lang in EN PL RU UA; do test -f "assets/cv/Kostiantyn_Bryl_CV_${role}_${lang}.pdf"; done
          done

      - name: Internal reference checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          pages=list(root.glob('*.html'))+list(root.glob('*/*.html'))+list(root.glob('work/*/*.html'))
          missing=[]
          for page in pages:
              text=page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)="([^"#?]+)',text):
                  if ref.startswith(('http://','https://','mailto:','data:')): continue
                  target=(page.parent/ref).resolve()
                  if ref.endswith('/'):
                      target=target/'index.html'
                  if not target.exists(): missing.append(f'{page}: {ref}')
          if missing: raise SystemExit('Missing local references:\n'+'\n'.join(missing))
          print('Internal references OK')
          PY

      - name: Lighthouse CI
        id: lighthouse
        continue-on-error: true
        run: |
          npm install --global @lhci/cli@0.15.x
          lhci autorun --config=lighthouserc.cjs

      - name: Lighthouse diagnostics
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='.lighthouseci-reports';
          if(!fs.existsSync(dir)){console.log('No Lighthouse report directory');process.exit(0)}
          const file=fs.readdirSync(dir).find(f=>f.endsWith('.report.json'))||fs.readdirSync(dir).find(f=>f.endsWith('.json'));
          if(!file){console.log('No Lighthouse JSON report');process.exit(0)}
          const r=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
          console.log('SCORES',Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])));
          for(const cat of ['accessibility','performance']){
            console.log(`--- ${cat.toUpperCase()} ---`);
            for(const ref of r.categories[cat].auditRefs){const a=r.audits[ref.id];if(a&&a.scoreDisplayMode!=='notApplicable'&&a.score!==1)console.log(`${ref.id}: score=${a.score} | ${a.title} | ${a.displayValue||''}`)}
          }
          NODE

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci-reports
          if-no-files-found: warn
          include-hidden-files: true

      - name: Enforce Lighthouse threshold
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
